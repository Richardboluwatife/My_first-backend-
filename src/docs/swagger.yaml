openapi: 3.0.0
info:
  title: Rent Management API
  version: 1.0.0

servers:
  - url: http://localhost:2000

tags:
  - name: Auth
    description: Authentication endpoints

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /auth/login:
    post:
      summary: Login user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Login successful
        401:
          description: Invalid password
        404:
          description: User not found

  /auth/users:
    get:
      summary: Get all users
      tags: [Auth]
      responses:
        200:
          description: List of users

    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - user_type
              properties:
                email:
                  type: string
                password:
                  type: string
                user_type:
                  type: string
                  enum: [landlord, tenant]
      responses:
        201:
          description: User created successfully

  /auth/users/me:
    get:
      summary: Get current user details
      tags: [Auth]
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
      responses:
        200:
          description: Current user details
        401:
          description: Unauthorized

  /auth/verify-otp:
    post:
      summary: Verify OTP
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                otp:
                  type: string
      responses:
        200:
          description: Verified
        400:
          description: Invalid OTP

  /auth/resend-otp:
    post:
      summary: Resend OTP
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
      responses:
        200:
          description: OTP sent
        400:
          description: Already verified
        404:
          description: User not found

  /tasks:
    get:
      summary: Get all tasks
      tags: [Tasks]
      responses:
        200:
          description: List of tasks
